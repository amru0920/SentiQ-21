<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SentiQ 21</title>
<meta name="description" content="Semak tahap kemurungan, kebimbangan dan tekanan anda dalam lebih kurang 2 minit, berasaskan soal selidik DASS-21.">
<meta name="theme-color" content="#CFE9E3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SentiQ 21">

<!-- Link preview card (WhatsApp, Telegram, Facebook, X).
     These URLs must be absolute - relative ones are ignored by the
     scrapers. Change the host below if the app moves to another domain. -->
<link rel="canonical" href="https://sentiq-21.pages.dev/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="SentiQ 21">
<meta property="og:locale" content="ms_MY">
<meta property="og:locale:alternate" content="en_US">
<meta property="og:locale:alternate" content="ta_MY">
<meta property="og:locale:alternate" content="zh_CN">
<meta property="og:url" content="https://sentiq-21.pages.dev/">
<meta property="og:title" content="SentiQ 21 — Saringan Kesihatan Mental DASS-21">
<meta property="og:description" content="Semak tahap kemurungan, kebimbangan dan tekanan anda dalam lebih kurang 2 minit. Skor dan tahap keparahan serta-merta, boleh simpan sebagai PDF.">
<meta property="og:image" content="https://sentiq-21.pages.dev/icons/og-image.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Logo SentiQ 21 - saringan kesihatan mental DASS-21">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="SentiQ 21 — Saringan Kesihatan Mental DASS-21">
<meta name="twitter:description" content="Semak tahap kemurungan, kebimbangan dan tekanan anda dalam lebih kurang 2 minit. Skor dan tahap keparahan serta-merta, boleh simpan sebagai PDF.">
<meta name="twitter:image" content="https://sentiq-21.pages.dev/icons/og-image.png">

<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="phone">

  <!-- ------------------------------------------------------- home -->
  <section class="view view--home is-active" id="view-home">
    <div class="view__scroll">
      <div class="lang-switch" id="lang-switch"
           role="group" data-i18n-aria="lang.label"></div>

      <div class="logo-card">
        <img src="icons/logo.png" alt="SentiQ 21" width="120" height="120">
        <p class="logo-card__welcome" data-i18n="home.welcome"></p>
        <p class="logo-card__name">SentiQ 21</p>
      </div>

      <div class="card">
        <h1 data-i18n="home.instructions"></h1>
        <p data-i18n="home.p1"></p>
        <p data-i18n="home.p2"></p>
        <hr>
        <p class="card__label" data-i18n="home.ratingTitle"></p>
        <ul class="scale" id="rating-scale"></ul>
      </div>
    </div>

    <div class="view__footer">
      <button class="btn btn--green" id="btn-start" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        <span data-i18n="home.start"></span>
      </button>
      <button class="btn btn--ghost-green" id="btn-history" type="button">
        <span data-i18n="home.history"></span>
      </button>
      <button class="btn btn--ghost-green" id="btn-install" type="button" hidden>
        <span data-i18n="home.install"></span>
      </button>
    </div>
  </section>

  <!-- ---------------------------------------------- questionnaire -->
  <section class="view" id="view-quiz">
    <header class="appbar">
      <button class="appbar__back" type="button" data-back="home"
              data-i18n-aria="quiz.back">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg>
      </button>
      <h1 data-i18n="quiz.title"></h1>
    </header>

    <div class="view__scroll" id="quiz-scroll">
      <div class="progress" id="progress">
        <div class="progress__bar"><span id="progress-fill"></span></div>
        <p class="progress__text" id="progress-text"></p>
      </div>

      <form id="quiz-form" novalidate></form>

      <div class="view__inline-footer">
        <button class="btn btn--pill-light" id="btn-submit" type="button">
          <span data-i18n="quiz.submit"></span>
        </button>
      </div>
    </div>
  </section>

  <!-- ----------------------------------------------------- result -->
  <section class="view" id="view-result">
    <header class="appbar">
      <button class="appbar__back" type="button" data-back="home"
              data-i18n-aria="result.back">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg>
      </button>
      <h1 data-i18n="result.title"></h1>
    </header>

    <div class="view__scroll">
      <div class="score-card">
        <h2 data-i18n="result.heading"></h2>
        <ul id="score-list"></ul>
      </div>

      <div class="bars" id="score-bars"></div>

      <p class="sync-note" id="sync-note" hidden></p>

      <button class="btn btn--purple" id="btn-print" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 8H5c-1.7 0-3 1.3-3 3v6h4v4h12v-4h4v-6c0-1.7-1.3-3-3-3zm-3 11H8v-5h8v5zm3-7c-.6 0-1-.4-1-1s.4-1 1-1 1 .4 1 1-.4 1-1 1zm-1-9H6v4h12V3z"/></svg>
        <span data-i18n="result.print"></span>
      </button>
      <button class="btn btn--pill-light" data-back="home" type="button">
        <span data-i18n="result.back"></span>
      </button>

      <p class="disclaimer" data-i18n="result.disclaimer"></p>
    </div>
  </section>

  <!-- ---------------------------------------------------- history -->
  <section class="view" id="view-history">
    <header class="appbar">
      <button class="appbar__back" type="button" data-back="home"
              data-i18n-aria="result.back">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg>
      </button>
      <h1 data-i18n="history.title"></h1>
    </header>

    <div class="view__scroll">
      <div id="history-list"></div>
      <div class="view__inline-footer">
        <button class="btn btn--pill-light" id="btn-clear-history" type="button">
          <span data-i18n="history.clear"></span>
        </button>
      </div>
    </div>
  </section>

  <!-- ------------------------- first-run language chooser -------- -->
  <!-- Deliberately not translated: nothing here can be, because it is the
       screen on which the language gets picked. -->
  <div class="sheet sheet--center" id="lang-dialog" hidden>
    <div class="sheet__backdrop"></div>
    <div class="sheet__panel sheet__panel--center" role="dialog"
         aria-modal="true" aria-labelledby="lang-dialog-title">
      <img src="icons/logo.png" alt="" width="76" height="76">
      <h2 id="lang-dialog-title">Pilih bahasa anda</h2>
      <p class="sheet__sub">
        Choose your language<br>
        <span lang="ta">உங்கள் மொழியைத் தேர்ந்தெடுக்கவும்</span><br>
        <span lang="zh-Hans">请选择语言</span>
      </p>
      <div class="lang-choices" id="lang-choices"></div>
    </div>
  </div>

  <!-- ------------------------------------------- install guide -->
  <div class="sheet" id="install-sheet" hidden>
    <div class="sheet__backdrop" data-close-install></div>
    <div class="sheet__panel" role="dialog" aria-modal="true"
         aria-labelledby="install-title">
      <span class="sheet__grip" aria-hidden="true"></span>

      <h2 class="sheet__title" id="install-title" data-i18n="install.title"></h2>
      <p class="sheet__sub" data-i18n="install.sub"></p>

      <p class="sheet__warn" id="install-warn" hidden></p>

      <button class="btn btn--green" id="btn-install-now" type="button" hidden>
        <span data-i18n="install.now"></span>
      </button>

      <div class="tabs" id="install-tabs" role="tablist">
        <button class="tab" type="button" role="tab" data-platform="android"
                data-i18n="install.android"></button>
        <button class="tab" type="button" role="tab" data-platform="ios"
                data-i18n="install.ios"></button>
      </div>

      <ol class="steps" id="install-steps"></ol>

      <button class="btn btn--pill-light" data-close-install type="button">
        <span data-i18n="install.close"></span>
      </button>
    </div>
  </div>

</div>

<!-- Rendered only when printing / saving as PDF. -->
<div class="printout" id="printout" aria-hidden="true"></div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script src="js/scoring.js"></script>
<script src="js/storage.js"></script>
<script src="js/supabase.js"></script>
<script src="js/printout.js"></script>
<script src="js/install.js"></script>
<script src="js/app.js"></script>
</body>
</html>
